[package]
name = "tinyasr-server"
version = "0.1.0"
edition = "2024"
description = "Streaming speech-to-text server on tinyasr with a Deepgram Flux compatible websocket"
license = "GPL-3.0-or-later"
publish = false # a server shipped as a container image; the tinyasr git dependency cannot go to crates.io

[dependencies]
tinyasr = { git = "https://github.com/dkaraush/tinyasr", rev = "8ad81cc2a45cc5d768d2e75b0ac126deed6d286d" }
tungstenite = "0.30"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# panic stays "unwind": a panic in one session must end only that session
